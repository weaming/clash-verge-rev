name: Fork Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (留空默认 v<package.json version>)'
        required: false
        type: string
        default: ''
      run_windows:
        description: '运行 Windows x64'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: '运行 macOS aarch64'
        required: false
        type: boolean
        default: false
      run_windows_arm64:
        description: '运行 Windows ARM64'
        required: false
        type: boolean
        default: false
      run_linux_amd64:
        description: '运行 Linux amd64'
        required: false
        type: boolean
        default: false

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Select build targets
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_WINDOWS: ${{ github.event.inputs.run_windows }}
          RUN_MACOS_AARCH64: ${{ github.event.inputs.run_macos_aarch64 }}
          RUN_WINDOWS_ARM64: ${{ github.event.inputs.run_windows_arm64 }}
          RUN_LINUX_AMD64: ${{ github.event.inputs.run_linux_amd64 }}
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const isPush = process.env.EVENT_NAME === 'push';
          const enabled = (envName, defaultOn) =>
            isPush ? defaultOn : process.env[envName] === 'true';

          const all = [
            {
              os: 'windows-latest',
              target: 'x86_64-pc-windows-msvc',
              bundle: 'nsis',
              id: 'windows',
              asset_glob: 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe',
              on: enabled('RUN_WINDOWS', true),
            },
            {
              os: 'macos-15',
              target: 'aarch64-apple-darwin',
              bundle: 'dmg',
              id: 'macos-aarch64',
              asset_glob: 'target/aarch64-apple-darwin/release/bundle/dmg/*.dmg',
              on: enabled('RUN_MACOS_AARCH64', false),
            },
            {
              os: 'windows-latest',
              target: 'aarch64-pc-windows-msvc',
              bundle: 'nsis',
              id: 'windows-arm64',
              asset_glob: 'target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe',
              on: enabled('RUN_WINDOWS_ARM64', false),
            },
            {
              os: 'ubuntu-22.04',
              target: 'x86_64-unknown-linux-gnu',
              bundle: 'deb',
              id: 'linux-amd64',
              asset_glob: 'target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb',
              on: enabled('RUN_LINUX_AMD64', false),
            },
          ];

          const selected = all
            .filter((item) => item.on)
            .map(({ on, ...rest }) => rest);

          console.log(`matrix=${JSON.stringify({ include: selected })}`);
          console.log(`has_targets=${selected.length > 0}`);
          EOF

  build:
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}
          prefix-key: 'v1-rust'
          shared-key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'pnpm'

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Add Rust Target
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.100.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Disable updater artifacts for unsigned build
        run: node -e "require('fs').writeFileSync('src-tauri/tauri.dev-nosign.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }} -c src-tauri/tauri.dev-nosign.conf.json

      - name: Upload bundle to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi

          shopt -s nullglob
          FILES=(${{ matrix.asset_glob }})
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No bundle matched ${{ matrix.asset_glob }}"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          ASSETS=()
          for file in "${FILES[@]}"; do
            base="$(basename "$file")"
            normalized="${base// /.}"
            cp "$file" "${STAGE_DIR}/${normalized}"
            ASSETS+=("${STAGE_DIR}/${normalized}")
          done

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "Clash Verge Rev ${TAG}" \
              --generate-notes || true
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded ${ASSETS[*]} to release ${TAG}"
