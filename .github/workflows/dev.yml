name: Fork Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (留空默认 v<package.json version>)'
        required: false
        type: string
        default: ''
      run_windows:
        description: '运行 Windows x64'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: '运行 macOS aarch64'
        required: false
        type: boolean
        default: false
      run_windows_arm64:
        description: '运行 Windows ARM64'
        required: false
        type: boolean
        default: false
      run_linux_amd64:
        description: '运行 Linux amd64'
        required: false
        type: boolean
        default: false

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dev:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            id: windows
            input: run_windows
            default_enabled: true
            asset_glob: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            id: macos-aarch64
            input: run_macos_aarch64
            default_enabled: false
            asset_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            id: windows-arm64
            input: run_windows_arm64
            default_enabled: false
            asset_glob: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            id: linux-amd64
            input: run_linux_amd64
            default_enabled: false
            asset_glob: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Determine whether to run target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_RUN="${{ matrix.default_enabled }}"
          elif [ "${{ github.event.inputs[matrix.input] }}" = "true" ]; then
            SHOULD_RUN="true"
          else
            SHOULD_RUN="false"
          fi
          echo "SHOULD_RUN=$SHOULD_RUN" >> "$GITHUB_ENV"
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Job ${{ matrix.id }} skipped as configured"
          fi

      - name: Checkout Repository
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        if: env.SHOULD_RUN == 'true'
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Rust Cache
        if: env.SHOULD_RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}
          prefix-key: 'v1-rust'
          shared-key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        if: env.SHOULD_RUN == 'true'
        with:
          run_install: false

      - name: Install Node
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'pnpm'

      - name: Pnpm install and prebuild
        if: env.SHOULD_RUN == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Add Rust Target
        if: env.SHOULD_RUN == 'true'
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.100.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Disable updater artifacts for unsigned build
        if: env.SHOULD_RUN == 'true'
        run: node -e "require('fs').writeFileSync('src-tauri/tauri.dev-nosign.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Tauri build
        if: env.SHOULD_RUN == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }} -c src-tauri/tauri.dev-nosign.conf.json

      - name: Upload bundle to GitHub Release
        if: env.SHOULD_RUN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi

          shopt -s nullglob
          FILES=(${{ matrix.asset_glob }})
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No bundle matched ${{ matrix.asset_glob }}"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          ASSETS=()
          for file in "${FILES[@]}"; do
            base="$(basename "$file")"
            normalized="${base// /.}"
            cp "$file" "${STAGE_DIR}/${normalized}"
            ASSETS+=("${STAGE_DIR}/${normalized}")
          done

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "Clash Verge Rev ${TAG}" \
              --generate-notes || true
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded ${ASSETS[*]} to release ${TAG}"
